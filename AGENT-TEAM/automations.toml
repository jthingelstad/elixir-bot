version = 2
repo = "/Users/otto/Projects/elixir-bot"
timezone = "America/Chicago"

# ACTIVE is reserved for a genuinely time-windowed or recovery activity. PAUSED means the
# historical schedule remains recorded but issue work is selected from GitHub and runs on demand
# as a normal app-visible project task. It is not a dormant queue to reactivate.

[[automation]]
id = "elixir-operations-manager"
name = "Elixir Operations Manager"
role_file = "AGENT-TEAM/operations-manager.md"
dispatch_label = "dispatch:operations"
schedule_kind = "recovery"
rrule = "RRULE:FREQ=HOURLY;INTERVAL=3;BYMINUTE=10"
model = "gpt-5.6-terra"
reasoning_effort = "high"
status = "ACTIVE"

