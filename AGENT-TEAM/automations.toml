version = 4
repo = "/Users/otto/Projects/elixir-bot"
timezone = "America/Chicago"

# Three active objective owners replace the retired role/dispatcher pipeline.
# Stable automation ids preserve the existing Codex task history and memory.

[[automation]]
id = "elixir-operations-manager"
name = "Run Elixir"
objective = "run"
role_file = "AGENT-TEAM/run-elixir.md"
schedule_kind = "recovery"
rrule = "RRULE:FREQ=HOURLY;INTERVAL=4;BYMINUTE=10"
model = "gpt-5.6-terra"
reasoning_effort = "high"
status = "ACTIVE"

[[automation]]
id = "elixir-data-analyst"
name = "Understand Clash Royale"
objective = "game"
role_file = "AGENT-TEAM/understand-clash-royale.md"
schedule_kind = "time_window"
rrule = "RRULE:FREQ=DAILY;BYHOUR=6;BYMINUTE=30"
model = "gpt-5.6-terra"
reasoning_effort = "high"
status = "ACTIVE"

[[automation]]
id = "elixir-quality-manager"
name = "Improve Elixir"
objective = "agent"
role_file = "AGENT-TEAM/improve-elixir.md"
schedule_kind = "time_window"
rrule = "RRULE:FREQ=DAILY;BYHOUR=8;BYMINUTE=0"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
status = "ACTIVE"
