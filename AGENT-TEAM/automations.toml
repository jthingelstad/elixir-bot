version = 2
repo = "."
timezone = "America/Chicago"

# Stable ids preserve Codex task history while names express durable objectives.

[[automation]]
id = "elixir-operations-manager"
name = "Run Elixir"
objective = "run"
objective_file = "AGENT-TEAM/run-elixir.md"
status = "ACTIVE"
rrule = "RRULE:FREQ=HOURLY;INTERVAL=12;BYMINUTE=10"
model = "gpt-5.6-terra"
reasoning_effort = "high"

[[automation]]
id = "elixir-data-analyst"
name = "Understand Clash Royale"
objective = "game"
objective_file = "AGENT-TEAM/understand-clash-royale.md"
status = "ACTIVE"
rrule = "RRULE:FREQ=DAILY;BYHOUR=6;BYMINUTE=30"
model = "gpt-5.6-terra"
reasoning_effort = "high"

[[automation]]
id = "elixir-quality-manager"
name = "Improve Elixir"
objective = "agent"
objective_file = "AGENT-TEAM/improve-elixir.md"
status = "ACTIVE"
rrule = "RRULE:FREQ=DAILY;BYHOUR=8;BYMINUTE=0"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
