{# The Observatory chat panel — polls /chat/messages, POSTs to /chat. #}
<div class="card">
  <div id="chatlog" class="chatlog"></div>
  <form id="chatform" style="display:flex; gap:.4rem; border-top:1px solid var(--rule); padding-top:.6rem;">
    <input id="chatmsg" placeholder="Ask Elixir… (e.g. why didn't you post about X?)" style="flex:1; padding:.45rem .6rem; border:1px solid var(--rule); border-radius:8px; font:inherit;" autocomplete="off">
    <button class="btn" type="submit">Send</button>
  </form>
</div>
<script>
(function(){
  const log = document.getElementById('chatlog');
  let lastCount = -1;
  function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function render(msgs){
    if(msgs.length === lastCount) return;
    lastCount = msgs.length;
    log.innerHTML = '';
    for(const m of msgs){
      const who = m.role === 'user' ? 'you' : 'elixir';
      const div = document.createElement('div');
      div.className = 'chatmsg ' + (m.role === 'user' ? 'me' : 'agent');
      div.innerHTML = '<strong>' + esc(who) + '</strong> ' + esc(m.content);
      log.appendChild(div);
    }
    log.scrollTop = log.scrollHeight;
  }
  async function poll(){
    try{
      const r = await fetch('/chat/messages');
      const j = await r.json();
      render(j.messages || []);
    }catch(e){}
  }
  document.getElementById('chatform').addEventListener('submit', async function(e){
    e.preventDefault();
    const inp = document.getElementById('chatmsg'); const msg = inp.value.trim();
    if(!msg) return; inp.value = '';
    const fd = new FormData(); fd.append('message', msg);
    try { await fetch('/chat', {method:'POST', body: fd}); } catch(e){}
    setTimeout(poll, 300);
  });
  poll(); setInterval(poll, 2500);
})();
</script>
