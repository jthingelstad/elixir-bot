<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Observatory{% endblock %} · Elixir</title>
  {% block head %}{% endblock %}
  <style>
    :root { --ink:#1b1b1f; --soft:#6b6b76; --rule:#e6e6ea; --accent:#7048b6; --bg:#f6f6f9; --chip:#f0eafb; --bad:#b02a1e; --good:#1e7d32; --amber:#9a6410; --amber-bg:#fbf1de; --good-bg:#e7f4e8; --bad-bg:#fdecea;
             --shadow:0 1px 2px rgba(20,18,30,.04), 0 2px 6px rgba(20,18,30,.05); }
    * { box-sizing: border-box; }
    body { font: 15px/1.5 -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--bg); margin: 0; }
    header.top { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--rule);
                 padding: .6rem 1rem; display: flex; gap: .25rem .6rem; align-items: center; flex-wrap: wrap; z-index: 5; }
    header.top .brand { font-weight: 700; letter-spacing: -.01em; margin-right: .5rem; color: var(--accent); }
    header.top a { color: var(--ink); text-decoration: none; padding: .3rem .55rem; border-radius: 7px; font-size: .92rem; }
    header.top a.active, header.top a:hover { background: var(--chip); }
    header.top .navsep { font-size: .64rem; text-transform: uppercase; letter-spacing: .07em;
                 color: var(--soft); padding: .3rem .1rem .3rem .55rem; margin-left: .2rem;
                 border-left: 1px solid var(--rule); align-self: center; }
    header.top .sp { flex: 1; }
    header.top .who { color: var(--soft); font-size: .85rem; }
    main { max-width: 72rem; margin: 1.3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; letter-spacing: -.015em; margin: .2rem 0 1.1rem; }
    h2 { font-size: 1.02rem; letter-spacing: -.01em; margin: 1.4rem 0 .4rem; }
    .muted { color: var(--soft); }
    .card { background: #fff; border: 1px solid var(--rule); border-radius: 12px; padding: 1rem 1.1rem;
            margin-bottom: 1rem; box-shadow: var(--shadow); }
    .card > h2:first-child { margin-top: 0; padding-bottom: .5rem; margin-bottom: .6rem;
            border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: .5rem; }
    .card.primary { border-color: #d9c9f2; box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }
    .card.primary > h2:first-child { color: var(--accent); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .9rem; }
    .badge { display: inline-block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
             background: var(--chip); color: var(--accent); padding: .12rem .5rem; border-radius: 999px; font-weight: 600; }
    .badge.bad { background: var(--bad-bg); color: var(--bad); }
    .badge.good, .badge.ok { background: var(--good-bg); color: var(--good); }
    .badge.warn { background: var(--amber-bg); color: var(--amber); }
    .badge.neutral { background: #eeeef1; color: var(--soft); }
    code { background: #f0f0f3; padding: .06rem .3rem; border-radius: 4px; font-size: .9em; }
    pre { background: #f6f6f8; border: 1px solid var(--rule); border-radius: 8px; padding: .7rem .9rem;
          overflow-x: auto; font-size: .82rem; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; background: #fff; }
    th, td { text-align: left; padding: .38rem .55rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
    th { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--soft); }
    tr:hover td { background: #fcfbff; }
    td.err { color: var(--bad); font-weight: 600; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    a { color: var(--accent); }
    a.btn, button.btn { display: inline-block; background: var(--accent); color: #fff; border: 0;
            padding: .42rem .8rem; border-radius: 8px; font-size: .88rem; text-decoration: none; cursor: pointer; }
    a.btn.ghost, button.btn.ghost { background: var(--chip); color: var(--accent); }
    .flash { background: #e7f4e8; border: 1px solid #bfe3c2; color: #1e5f28; padding: .55rem .8rem;
             border-radius: 8px; margin-bottom: 1rem; font-size: .9rem; }
    form.inline { display: inline; }
    .filters { display: flex; gap: .5rem; align-items: center; margin-bottom: .8rem; flex-wrap: wrap; }
    .filters input, .filters select { padding: .35rem .5rem; border: 1px solid var(--rule); border-radius: 7px; font: inherit; }
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: .15rem .8rem; font-size: .9rem; }
    .kv dt { color: var(--soft); }
    .kv dd { margin: 0; }
    .chatlog { max-height: 30rem; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; padding-bottom: .6rem; }
    .chatmsg { padding: .45rem .65rem; border-radius: 9px; font-size: .92rem; max-width: 90%; white-space: pre-wrap; }
    .chatmsg strong { color: var(--accent); margin-right: .3rem; }
    .chatmsg.me { background: var(--chip); align-self: flex-end; }
    .chatmsg.agent { background: #f4f4f6; align-self: flex-start; }
  </style>
</head>
<body>
  <header class="top">
    <span class="brand">Elixir</span>
    <a href="/" class="{{ 'active' if nav=='command' else '' }}" title="Operator home: what needs your decision, who needs attention, the clan at a glance, what Elixir's been saying">Command</a>
    <span class="navsep" title="What's waiting on you: leadership decisions and cases">Decisions</span>
    <a href="/management" class="{{ 'active' if nav=='management' else '' }}" title="Promote/demote/kick states, open #actions cards, decision cases">Management</a>
    <span class="navsep" title="How POAP KINGS is doing: roster, war, awards">Clan</span>
    <a href="/members" class="{{ 'active' if nav=='members' else '' }}" title="Active roster with management verdicts + per-member deep-dive">Members</a>
    <a href="/war" class="{{ 'active' if nav=='war' else '' }}" title="River Race clock, weekly standings, and per-day war attendance">War</a>
    <a href="/awards" class="{{ 'active' if nav=='awards' else '' }}" title="Season award history (War Champ, free-pass rotation)">Awards</a>
    <span class="navsep" title="What Elixir has been saying and doing, and how it learns">Elixir</span>
    <a href="/awareness" class="{{ 'active' if nav=='awareness' else '' }}" title="The hourly awareness loop: gate tier, decision, signals, posts">Awareness</a>
    <a href="/editorial" class="{{ 'active' if nav=='editorial' else '' }}" title="Editorial rubric (exemplars/anti-patterns) + weekly retrospectives">Editorial</a>
    <a href="/memories" class="{{ 'active' if nav=='memories' else '' }}" title="Memory store — searchable, by kind/member">Memories</a>
    <span class="navsep" title="The machine underneath: ingest, jobs, model calls, cost, health">System</span>
    <a href="/overview" class="{{ 'active' if nav=='overview' else '' }}" title="System health at a glance: latest tick, war clock, awareness 24h, errors">Overview</a>
    <a href="/ticks" class="{{ 'active' if nav=='ticks' else '' }}" title="Engine-tick history + event-stream cursor positions">Ticks</a>
    <a href="/polling" class="{{ 'active' if nav=='polling' else '' }}" title="Adaptive per-member poll heat + next-tick fetch plan">Polling</a>
    <a href="/streams" class="{{ 'active' if nav=='streams' else '' }}" title="Emitted domain events, state baselines, and raw API payloads">Streams</a>
    <a href="/api-sentinel" class="{{ 'active' if nav=='api' else '' }}" title="API admission ledger (accept/reject) + schema-drift tracker">API</a>
    <a href="/activities" class="{{ 'active' if nav=='activities' else '' }}" title="Scheduled-job registry: schedule, next run, last outcome">Activities</a>
    <a href="/llm" class="{{ 'active' if nav=='llm' else '' }}" title="LLM call history with full prompt/response drill-down">LLM</a>
    <a href="/cost" class="{{ 'active' if nav=='cost' else '' }}" title="LLM spend by workflow and model (7d/30d)">Cost</a>
    <a href="/incidents" class="{{ 'active' if nav=='incidents' else '' }}" title="Runtime incident ledger (fail-soft errors + tracebacks)">Incidents</a>
    <a href="/recognition" class="{{ 'active' if nav=='recognition' else '' }}" title="Recognition ledger — historical award claims (the retired recognition system), NOT leader decisions">Recognition</a>
    <span class="sp"></span>
    <a href="/chat" class="{{ 'active' if nav=='chat' else '' }}">Chat</a>
    <span class="who">{{ login }}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
