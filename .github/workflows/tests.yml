name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # full history + tags (release-notes reads v* tags)
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked
      # Every gate lives in scripts/gates.sh, which the local pre-commit hook
      # runs too. Do NOT add gate steps here: a gate CI runs and the hook does
      # not is how three pushes passed locally and failed in CI on 2026-08-03.
      - name: Gates (same list the pre-commit hook runs)
        run: bash scripts/gates.sh
