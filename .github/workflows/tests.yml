name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # full history + tags (release-notes reads v* tags)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - name: Verify dependency lock
        run: python scripts/check_dependency_lock.py
      - name: Verify documentation
        run: python scripts/check_docs.py
      - name: Verify exception policy
        run: python scripts/check_exception_hygiene.py
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest tests/ -q
