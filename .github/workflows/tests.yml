name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # full history + tags (release-notes reads v* tags)
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked
      - name: Verify dependency lock
        run: uv lock --check
      - name: Audit locked dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/requirements.txt --disable-pip
      - name: Verify documentation
        run: uv run --locked python scripts/check_docs.py
      - name: Verify exception policy
        run: uv run --locked python scripts/check_exception_hygiene.py
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Capability contracts
        run: uv run --locked mypy capabilities/contracts.py
      - name: Tests
        run: uv run --locked pytest tests/ -q --cov=capabilities --cov-report=term-missing --cov-fail-under=80
