[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true

[tool.ruff]
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    # E402: deferred imports are used deliberately throughout to avoid
    # circular-import issues between runtime/, storage/, and db/.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# These runtime modules are deliberate re-export hubs. F401 stays enabled
# everywhere else so genuine dead imports are caught.
"runtime/app.py" = ["F401", "F821"]
"runtime/jobs/__init__.py" = ["F401"]
"runtime/helpers/__init__.py" = ["F401"]
