[project]
name = "elixir-bot"
version = "0.1.0"
description = "Discord clan operations bot for POAP Kings"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.14.1,<4.0",
    "anthropic>=0.117.0,<1.0",
    "apscheduler>=3.11.3,<4.0",
    "discord.py>=2.7.1,<3.0",
    "emoji>=2.15.0,<3.0",
    "jinja2>=3.1.6,<4.0",
    "jsonschema>=4.26.0,<5.0",
    "markdown>=3.10.2,<4.0",
    "pillow>=12.3.0,<13.0",
    "python-dotenv>=1.2.2,<2.0",
    "pytz>=2026.2",
    "requests>=2.34.2,<3.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3",
    "packaging>=26.2,<27",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.22,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# E402 was ignored REPO-WIDE with a comment claiming deferred imports were
# needed "throughout to avoid circular-import issues". Measured 2026-07-30:
# 18 violations in 8 files, and not one was a cycle workaround — they were a
# logger assignment, an __all__ list and a regex constant sitting above the
# import block. All were relocated; every entrypoint still imports cleanly.
#
# What remains is these two one-off maintenance scripts, which genuinely must
# extend sys.path before importing the package. A repo-wide ignore let the
# style spread; naming the two real cases keeps it contained.
"scripts/repair_data_integrity_20260715.py" = ["E402"]
"scripts/review_agent_feedback.py" = ["E402"]

# These runtime modules are deliberate re-export hubs. F401 stays enabled
# everywhere else so genuine dead imports are caught.
"runtime/app.py" = ["F401"]
"runtime/jobs/__init__.py" = ["F401"]
"runtime/helpers/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = true
